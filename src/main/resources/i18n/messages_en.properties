# start screen
start.title=Moon Check
start.intro=This is the official checker for the cs2-moon.ru server. An administrator is watching via Discord screen share and receives the results in the Moon panel. The app will automatically inspect your PC for signs of CS2 cheats.
start.bullets=What is checked:<br>• Cheat files on all drives (by name and hash)<br>• Deleted and renamed files (NTFS journal, Recycle Bin)<br>• Program execution history (Prefetch, BAM, UserAssist, etc.)<br>• Running processes, kernel drivers, DMA hardware, virtual machines<br>• Browser history — cheat-site matches only<br>• All Steam accounts on the PC and their VAC status<br>• Macro software and USB history<br>• Windows Defender detection history<br>• Signs the PC was cleaned before the check
start.button=Start check
start.relaunch=Restart as administrator
start.noadmin=Not running as administrator — some checks will be unavailable. Restart the app as administrator.

