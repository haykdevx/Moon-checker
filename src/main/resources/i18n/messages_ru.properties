# verdicts
verdict.validated=ПОДТВЕРЖДЁННОЕ ОБНАРУЖЕНИЕ
verdict.validated.help=известный чит-файл опознан по точному хешу. Окончательное решение за администратором.
verdict.review=НУЖНА ПРОВЕРКА АДМИНОМ
verdict.review.help=есть признаки, которые должен оценить человек. Это не вердикт «читер».
verdict.unsupported=НЕПОДДЕРЖИВАЕМАЯ СИСТЕМА
verdict.unsupported.help=эта ОС или архитектура не проверена для чекера; на результаты нельзя полагаться.
verdict.incomplete=ПРОВЕРКА НЕ ЗАВЕРШЕНА
verdict.incomplete.help=часть обязательных проверок не выполнилась, поэтому «ничего не найдено» утверждать нельзя.
verdict.none=УЛИК НЕ НАЙДЕНО
verdict.none.help=все обязательные проверки выполнены, ничего требующего проверки нет. Это не доказательство чистоты ПК.

