name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Build & selftest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Selftest (exercises the Linux modules)
        run: java -jar target/moon-checker.jar --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: moon-checker-jar
          path: target/moon-checker.jar
          if-no-files-found: error

  windows:
    name: Build & selftest (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      # The real point of this job: run every Windows-only code path
      # (JNA registry, NTFS MFT/USN, AmCache reg load, ADS, kernel services,
      # Defender/PowerShell) on an actual Windows host on every push.
      - name: Selftest (exercises the Windows modules)
        run: java -jar target/moon-checker.jar --selftest

      - name: Headless inspection + report
        run: |
          java -jar target/moon-checker.jar --cli --out reports
          dir reports

      - uses: actions/upload-artifact@v4
        with:
          name: windows-check-report
          path: reports/
          if-no-files-found: warn

  panel:
    name: Moon Panel + checker round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Panel tests
        working-directory: web
        env:
          DJANGO_DEBUG: '1'
        run: |
          pip install -r requirements.txt
          python manage.py test tests

      # The freshly built checker claims a code, streams progress and uploads to a live
      # dev server; the panel must end up with a completed check and a verification code.
      - name: Checker <-> panel round-trip
        env:
          DJANGO_DEBUG: '1'
          SQLITE_PATH: ${{ runner.temp }}/panel.sqlite3
        run: |
          mvn -B -q -DskipTests package
          cd web
          python manage.py migrate -v0
          python manage.py bootstrap_owner ci-owner > /dev/null
          code=$(python manage.py shell -v0 -c "
          from accounts.models import User; from checks.models import CheckSession; from checks import codes
          from django.utils import timezone; from datetime import timedelta
          s = CheckSession.objects.create(admin=User.objects.get(username='ci-owner'), player_name='ci',
                                          code=codes.generate(), expires_at=timezone.now() + timedelta(minutes=30))
          print(s.code)" | tail -1)
          python manage.py runserver 127.0.0.1:8765 --noreload > "$RUNNER_TEMP/runserver.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/healthz && break; sleep 1; done
          java -jar ../target/moon-checker.jar --cli --server http://127.0.0.1:8765 --code "$code" \
               --modules linuxproc,linuxhist --out "$RUNNER_TEMP/scan"
          python manage.py shell -v0 -c "
          from checks.models import CheckSession
          s = CheckSession.objects.get(code='$code')
          assert s.status == 'COMPLETED' and s.verification_code, (s.status, s.verification_code)
          print('panel received', s.verdict, s.verification_code)"
