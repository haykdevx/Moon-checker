verdict.review=REVIEW REQUIRED
verdict.review.help=indicators need a human look. This is not a cheating verdict.
verdict.unsupported=UNSUPPORTED SYSTEM
verdict.unsupported.help=this OS or architecture is not one the checker is validated on; results cannot be relied on.
verdict.incomplete=INCOMPLETE SCAN
verdict.incomplete.help=some required checks did not complete, so "nothing found" cannot be concluded.
verdict.none=NO EVIDENCE FOUND
verdict.none.help=every required check completed and found nothing to review. Not proof the PC is clean.

