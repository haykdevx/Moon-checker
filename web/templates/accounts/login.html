{% extends "base_auth.html" %}
{% load i18n %}
{% block title %}{% translate "Sign in" %}{% endblock %}
{% block content %}
<form method="post" novalidate>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% include "_form.html" %}
  <button class="btn primary" type="submit">{% translate "Sign in" %}</button>
</form>
<p class="muted small">{% translate "Accounts are by invitation only. Ask your head admin for an invite link." %}</p>
{% endblock %}
