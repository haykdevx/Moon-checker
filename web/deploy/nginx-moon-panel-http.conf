# Moon Panel — HTTP-only bootstrap config, used until the certificate exists.
# deploy.sh then installs nginx-moon-panel.conf (HTTPS) in its place.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 20m;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot); never proxied to the app
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/moon-panel-acme;
        default_type text/plain;
    }

    # checker downloads straight from disk
    location /download/files/ {
        alias /opt/moon-panel/downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
    }

    location /api/ {
        limit_req zone=moon_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://__UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 180s;
    }

    location = /login/ {
        limit_req zone=moon_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://__UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
